<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1510" viewBox="0 0 1040 1510" role="img" aria-labelledby="title desc"><title id="title">Illustrative employee progress report</title><desc id="desc">Sample Upset Customer report: overall score 60 out of 100; five skill scores, response examples and feedback, next action and practice reminder.</desc><rect width="1040" height="1510" fill="#F5EBF3"/><rect x="38" y="38" width="964" height="1434" rx="18" fill="#FBF7FA"/><style>text{font-family:Arial,sans-serif;fill:#3A2438}.muted{fill:#5B4B58}.plum{fill:#7A2E5C}.serif{font-family:Georgia,serif}</style><text x="82" y="94" font-size="17" class="plum" font-weight="600">WHAT WOULD YOU SAY?</text><text x="82" y="149" font-size="40" class="serif" font-weight="400">Alex’s Progress Report</text><text x="82" y="188" font-size="19" class="muted" font-weight="400">Upset Customer · Illustrative example</text><path d="M82 218H958" stroke="#DECCD8"/><text x="82" y="264" font-size="23" class="" font-weight="600">Your overall score</text><text x="82" y="335" font-size="49" class="serif plum" font-weight="400">60 / 100</text><text x="366" y="272" font-size="21" class="" font-weight="600">What this means</text><text x="366" y="309" font-size="20" class="muted" font-weight="400">You are building consistency across the conversation.</text><text x="366" y="341" font-size="20" class="muted" font-weight="400">Your strongest area was Communication.</text><text x="366" y="373" font-size="20" class="muted" font-weight="400">Continue practicing Problem Solving.</text><path d="M82 411H958" stroke="#DECCD8"/><text x="82" y="457" font-size="23" class="" font-weight="600">Skill scores</text><text x="82" y="505" font-size="21" class="" font-weight="400">Empathy</text><rect x="320" y="489" width="530" height="12" rx="6" fill="#E9E1E7"/><rect x="320" y="489" width="318.0" height="12" rx="6" fill="#7A2E5C"/><text x="882" y="505" font-size="20" class="" font-weight="400">12/20</text><text x="82" y="554" font-size="21" class="" font-weight="400">Listening</text><rect x="320" y="538" width="530" height="12" rx="6" fill="#E9E1E7"/><rect x="320" y="538" width="318.0" height="12" rx="6" fill="#7A2E5C"/><text x="882" y="554" font-size="20" class="" font-weight="400">12/20</text><text x="82" y="603" font-size="21" class="" font-weight="400">Ownership</text><rect x="320" y="587" width="530" height="12" rx="6" fill="#E9E1E7"/><rect x="320" y="587" width="318.0" height="12" rx="6" fill="#7A2E5C"/><text x="882" y="603" font-size="20" class="" font-weight="400">12/20</text><text x="82" y="652" font-size="21" class="" font-weight="400">Problem Solving</text><rect x="320" y="636" width="530" height="12" rx="6" fill="#E9E1E7"/><rect x="320" y="636" width="212.0" height="12" rx="6" fill="#7A2E5C"/><text x="882" y="652" font-size="20" class="" font-weight="400">8/20</text><text x="82" y="701" font-size="21" class="" font-weight="400">Communication</text><rect x="320" y="685" width="530" height="12" rx="6" fill="#E9E1E7"/><rect x="320" y="685" width="424.0" height="12" rx="6" fill="#7A2E5C"/><text x="882" y="701" font-size="20" class="" font-weight="400">16/20</text><path d="M82 747H958" stroke="#DECCD8"/><text x="82" y="791" font-size="23" class="" font-weight="600">Your practice, round by round</text><text x="82" y="833" font-size="18" class="plum" font-weight="600">Round 1 · Initial response</text><text x="82" y="870" font-size="21" class="" font-weight="400">“I understand this is frustrating. Let me check your account</text><text x="82" y="901" font-size="21" class="" font-weight="400">and see what happened with the charge.”</text><text x="82" y="940" font-size="19" class="muted" font-weight="400">Feedback: You made your role in moving the issue forward clear.</text><text x="82" y="990" font-size="18" class="plum" font-weight="600">Round 2 · Response excerpt</text><text x="82" y="1027" font-size="21" class="" font-weight="400">“I understand you have contacted us three times about the same</text><text x="82" y="1058" font-size="21" class="" font-weight="400">charge. Could you confirm the dates and amounts…”</text><text x="82" y="1094" font-size="19" class="muted" font-weight="400">Feedback: You responded to specific details the customer shared</text><text x="82" y="1123" font-size="19" class="muted" font-weight="400">rather than giving a general response.</text><path d="M82 1155H958" stroke="#DECCD8"/><text x="82" y="1199" font-size="23" class="" font-weight="600">Your next action</text><text x="82" y="1239" font-size="21" class="" font-weight="400">Acknowledge the specific concern, state what I will do next,</text><text x="82" y="1271" font-size="21" class="" font-weight="400">and agree on a clear update time.</text><rect x="82" y="1310" width="370" height="54" rx="27" fill="#7A2E5C"/><text x="267" y="1344" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" style="fill:#FBF7FA">Set your practice reminder</text><rect x="477" y="1310" width="180" height="54" rx="27" fill="none" stroke="#7A2E5C"/><text x="521" y="1344" font-size="19" class="plum" font-weight="400">Try again</text><text x="82" y="1420" font-size="17" class="muted" font-weight="400">Sample responses and scores · Not employee data</text></svg>