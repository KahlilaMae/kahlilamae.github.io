<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>After AI Adoption | Kahlila Mae Liverpool</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4efec;
      color: #241f20;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 5%;
    }

    .name {
      color: #241f20;
      font-family: Georgia, serif;
      font-size: 22px;
      text-decoration: none;
    }

    .back-link {
      color: #844557;
      font-size: 15px;
      text-decoration: none;
    }

    main {
      width: min(900px, 90%);
      margin: 25px auto 70px;
    }

    .document {
      width: 100%;
      padding: 18px;
      overflow: hidden;
      background: white;
      border: 1px solid #d6cac6;
      border-radius: 20px;
      box-shadow: 0 15px 45px rgba(36, 31, 32, 0.08);
    }

    #pdf-canvas {
      display: block;
      width: 100%;
      height: auto;
      background: white;
    }

    .loading-message {
      padding: 60px 20px;
      color: #625d5a;
      text-align: center;
    }

    .error-message {
      padding: 50px 20px;
      color: #844557;
      text-align: center;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 150px;
      min-height: 48px;
      padding: 0 24px;
      border: 1px solid #844557;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .open-button {
      background: #844557;
      color: white;
    }

    .download-button {
      background: transparent;
      color: #844557;
    }

    @media (max-width: 700px) {
      header {
        padding: 20px 5%;
      }

      .name {
        font-size: 18px;
      }

      main {
        width: 94%;
        margin-top: 15px;
      }

      .document {
        padding: 8px;
        border-radius: 12px;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
      }

      .button {
        width: min(260px, 100%);
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="name" href="index.html">
      Kahlila Mae Liverpool
    </a>

    <a class="back-link" href="index.html">
      Back to home
    </a>
  </header>

  <main>

    <div class="document" id="document-container">

      <div class="loading-message" id="loading-message">
        Loading the one-pager…
      </div>

      <canvas id="pdf-canvas"></canvas>

    </div>

    <div class="buttons">

      <a
        class="button open-button"
        href="AfterAIAdoption.pdf?v=7"
        target="_blank"
        rel="noopener">
        Open PDF
      </a>

      <a
        class="button download-button"
        href="AfterAIAdoption.pdf?v=7"
        download="After-AI-Adoption-Kahlila-Mae-Liverpool.pdf">
        Download PDF
      </a>

    </div>

  </main>

  <script type="module">
    import * as pdfjsLib from
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";

    const pdfAddress = "AfterAIAdoption.pdf?v=7";
    const canvas = document.getElementById("pdf-canvas");
    const context = canvas.getContext("2d");
    const container = document.getElementById("document-container");
    const loadingMessage = document.getElementById("loading-message");

    let pdfPage;

    async function loadPDF() {
      try {
        const pdf = await pdfjsLib.getDocument(pdfAddress).promise;
        pdfPage = await pdf.getPage(1);

        loadingMessage.style.display = "none";

        await renderPDF();
      } catch (error) {
        loadingMessage.className = "error-message";
        loadingMessage.innerHTML =
          'The preview could not load. Please use the "Open PDF" button below.';
      }
    }

    async function renderPDF() {
      if (!pdfPage) {
        return;
      }

      const originalViewport = pdfPage.getViewport({ scale: 1 });
      const availableWidth = container.clientWidth - 36;
      const displayScale = availableWidth / originalViewport.width;
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      const renderViewport = pdfPage.getViewport({
        scale: displayScale * pixelRatio
      });

      canvas.width = renderViewport.width;
      canvas.height = renderViewport.height;

      canvas.style.width =
        `${renderViewport.width / pixelRatio}px`;

      canvas.style.height =
        `${renderViewport.height / pixelRatio}px`;

      await pdfPage.render({
        canvasContext: context,
        viewport: renderViewport
      }).promise;
    }

    let resizeTimer;

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderPDF, 200);
    });

    loadPDF();
  </script>

</body>

</html>
