<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Work | Kahlila Mae Liverpool</title>

  <style>
    body {
      margin: 0;
      background: #f4efec;
      color: #241f20;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 5%;
    }

    .name {
      color: #241f20;
      font-family: Georgia, serif;
      font-size: 22px;
      text-decoration: none;
    }

    .back-link {
      color: #844557;
      font-size: 15px;
      text-decoration: none;
    }

    main {
      width: min(1000px, 90%);
      margin: 20px auto 60px;
    }

    h1 {
      margin-bottom: 30px;
      font-family: Georgia, serif;
      font-size: clamp(34px, 5vw, 56px);
      font-weight: 400;
    }

    .pdf-viewer {
      display: block;
      width: 100%;
      height: 85vh;
      padding: 0;
      border: 1px solid #cbbdb9;
      border-radius: 18px;
      background: white;
    }

    .download-link {
      display: inline-block;
      margin-top: 20px;
      color: #844557;
      text-decoration: none;
    }

    .download-link:hover,
    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      header {
        padding: 20px 5%;
      }

      .name {
        font-size: 18px;
      }

      main {
        width: 92%;
        margin-top: 10px;
      }

      h1 {
        margin-bottom: 22px;
      }

      .pdf-viewer {
        height: 70vh;
        border-radius: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="name" href="index.html">
      Kahlila Mae Liverpool
    </a>

    <a class="back-link" href="index.html">
      Back to home
    </a>
  </header>

  <main>
    <h1>After AI Adoption</h1>

    <iframe
      class="pdf-viewer"
      src="AfterAdoption.pdf?v=2"
      title="After AI Adoption PDF">
    </iframe>

    <a
      class="download-link"
      href="AfterAdoption.pdf"
      download>
      Download the PDF
    </a>
  </main>

</body>

</html>
