  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4efec;

    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 5%;
    }

    .name {
      color: #241f20;
      font-family: Georgia, serif;
      font-size: 22px;
      text-decoration: none;
    }

    .back-link {
      color: #844557;
      font-size: 15px;
      text-decoration: none;
    }

    main {
      width: min(760px, 90%);
      margin: 100px auto;
      text-align: center;
    }

    .label {
      margin-bottom: 20px;
      color: #844557;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 24px;
      font-family: Georgia, serif;
      font-size: clamp(42px, 7vw, 70px);
      font-weight: 400;
      line-height: 1.1;

      max-width: 620px;
      margin: 0 auto 38px;
      color: #625d5a;
      font-size: 18px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 145px;
      min-height: 48px;
      padding: 0 24px;
      border: 1px solid #844557;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .open-button {
      background: #844557;
      color: white;
    }

    .download-button {
      background: transparent;
      color: #844557;
    }

    @media (max-width: 700px) {
      header {
        padding: 20px 5%;
      }

      .name {
        font-size: 18px;
      }

      main {
        margin: 70px auto;
      }

      h1 {
        font-size: 44px;
      }

      .description {
        font-size: 16px;
      }

      .buttons {
        flex-direction: column;
        align-items: center;
      }
