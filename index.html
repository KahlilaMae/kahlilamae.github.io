<style>

:root{
  --ink:#3A2438;
  --muted:#5B4B58;

  /* Main site background */
  --paper:#F5EBF3;

  /* Major boxes */
  --card:#FBF7FA;

  --line:rgba(122,46,92,.18);
  --soft-line:rgba(122,46,92,.14);
  --accent:#7A2E5C;

  --max:1120px;
  --radius:26px;

  --linkedin-bg:#FBF7FA;
  --linkedin-border:rgba(122,46,92,.25);

  --email-bg:#7A2E5C;
  --email-border:rgba(122,46,92,.18);
}


/* ========================= */
/* BASE                      */
/* ========================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);

  font-family:'DM Sans',Arial,sans-serif;
  font-size:1.25rem;
  font-weight:400;
  line-height:1.625;

  -webkit-font-smoothing:antialiased;
}

a{
  color:inherit;
  text-decoration:none;
}

/* Visible focus for keyboard users only */
a:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:3px;
}

/* Text for screen readers only */
.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  margin:-1px;
  padding:0;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
  border:0;
}

.wrap{
  width:min(calc(100% - 48px),var(--max));
  margin:0 auto;
}


/* ========================= */
/* TYPOGRAPHY                */
/* ========================= */

h1{
  font-family:'Playfair Display',Georgia,serif;
  font-size:3rem;
  font-weight:400;
  line-height:1.17;
  letter-spacing:-.035em;
}

h2,
h3,
.intro,
.question-text{
  font-family:'Playfair Display',Georgia,serif;
  font-size:1.75rem;
  font-weight:400;
  line-height:1.3;
  letter-spacing:-.02em;
}

.eyebrow,
.label{
  font-family:'DM Sans',Arial,sans-serif;
  font-size:.8125rem;
  font-weight:500;
  line-height:1.4;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--accent);
}

/* Consistent body text across the entire site */
p,
.card p,
.focus-item p,
.human p,
.connect p,
.guides-copy p{
  font-family:'DM Sans',Arial,sans-serif;
  font-size:1rem;
  font-weight:400;
  line-height:1.625;
}


/* ========================= */
/* NAVIGATION                */
/* ========================= */

nav{
  position:sticky;
  top:0;
  z-index:20;
  background:#F5EBF3;
  border-bottom:1px solid var(--line);
}

.nav{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-family:'Playfair Display',Georgia,serif;
  font-size:1.15rem;
  font-weight:400;
  color:#3A2438;
}

.nav-link{
  font-family:'DM Sans',Arial,sans-serif;
  font-size:.95rem;
  font-weight:500;
  color:var(--accent);
}

.nav-link:hover{
  text-decoration:underline;
  text-underline-offset:4px;
}


/* ========================= */
/* HERO                      */
/* ========================= */

.hero{
  position:relative;
  min-height:720px;
  overflow:hidden;
  background:var(--paper);
}

.hero-photo{
  position:absolute;
  inset:0;

  background-image:url("./Kahlila-hero-final(4).png");
  background-repeat:no-repeat;
  background-size:auto 80%;
  background-position:75% bottom;

  z-index:0;
}


/* ========================= */
/* HERO TEXT                 */
/* ========================= */

.hero-content{
  position:relative;
  z-index:2;

  min-height:inherit;

  display:flex;
  align-items:center;
}

.hero-copy{
  width:47%;
  max-width:525px;
  transform:translateY(-18px);
}

.hero h1{
  max-width:525px;
  margin:22px 0 28px;
}

.hero p{
  max-width:505px;
  margin:0;
  color:var(--muted);
}


/* ========================= */
/* ALL SECTIONS              */
/* ========================= */

section{
  padding:105px 0;
  border-top:1px solid var(--line);
}

.label{
  margin-bottom:36px;
}


/* ========================= */
/* WHAT GUIDES ME            */
/* ========================= */

.guides-section{
  border-top:1px solid var(--line);
}

.guides-content{
  max-width:940px;
  margin:0;
  text-align:left;
}

.guides-content .intro{
  max-width:900px;
  margin:0 0 20px;
}

.guides-copy{
  max-width:900px;
  margin:0;
  color:var(--muted);
}

.guides-copy p{
  margin:0;
}

/* MY APPROACH               */
/* ========================= */

.cards{
